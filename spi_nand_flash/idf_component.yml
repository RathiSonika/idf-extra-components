version: "1.5.0"
description: Driver for accessing SPI NAND Flash
url: https://github.com/espressif/idf-extra-components/tree/master/spi_nand_flash
issues: https://github.com/espressif/idf-extra-components/issues
repository: https://github.com/espressif/idf-extra-components.git
documentation: https://espressif.github.io/idf-extra-components/latest/spi_nand_flash/index.html
dependencies:
  idf:
    version: ">=5.0"
    require: public
  espressif/dhara:
    version: "1.*"
    override_path: "../dhara"
    require: public
    rules:
      - if: "$CONFIG{NAND_FLASH_ENABLE_WL} == True"
